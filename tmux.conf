# vim: fdm=marker

# https://github.com/tmux-plugins/tpm/issues/67#issuecomment-319561401
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/bin:/usr/bin"

set-option -g default-shell /bin/zsh
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -g mouse on
set -g set-clipboard on

# Bigger scrollback, and don't lag nvim's escape-key mode switching
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on

set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"

# Panel settings {{{{
    # Use vi keybindings for tmux commandline input.
    # Note that to get command mode you need to hit ESC twice...
    set -g status-keys vi

    # Use vi keybindings in copy and choice modes
    setw -g mode-keys vi

    # Vi-style copy mode bindings
    bind -T copy-mode-vi v send-keys -X begin-selection
    bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
    bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

    # Enter copy mode with prefix + v (in addition to default prefix + [)
    bind v copy-mode

    # Start numering at 1
    set -g base-index 1
    setw -g pane-base-index 1
    set -g renumber-windows on
# }}}}

# Bindings {{{{
    unbind C-b
    set -g prefix C-b
    bind C-b send-prefix

    # disable this motherfucker
    unbind d

    # prefix + r to reload tmux configuration
    # overwrites tmux-sensible as it doesn't show any message
    unbind r
    bind r source-file "$HOME/.tmux.conf" \; display-message "Config reloaded..."

    # https://github.com/sbernheim4/dotfiles/blob/master/.tmux.conf#L20
    unbind e
    bind e new-window -n '~/.tmux.conf' "sh -c '/opt/homebrew/bin/vim ~/.tmux.conf && tmux source ~/.tmux.conf'"

    # {{{ prefix + {p,n} prev, next window
        unbind n
        bind n next-window

        unbind p
        bind p previous-window
    # }}}

    # {{{ switch window and sessions w/ fzf prompt
    # https://github.com/christoomey/dotfiles/blob/f4f9da69586503823de9ff075fbf627ec2bb6fb5/tmux/tmux.conf#L107
        unbind '='
        bind '=' display-popup -h 30% -E "~/.local/bin/tmux-session-picker"

        unbind '+'
        bind '+' display-popup -h 30% -E "export PATH=/opt/homebrew/bin:/usr/bin:\$PATH; tmux list-windows | fzf --cycle --layout=reverse-list | sed -E 's/:.*$//' | xargs tmux select-window -t"
    # }}}

    # {{{ cheatsheet because I always forgot keybindings
        unbind "'"
        bind "'" display-popup -E "export PATH=/opt/homebrew/bin:/usr/bin:\$PATH; cat ~/.tmux/CHEATSHEET.md | fzf --cycle --layout=reverse-list"
    # }}}

    # {{{ maximize > zoom
        unbind m
        bind m resize-pane -Z
    # }}}

# }}}}

# Plugins {{{{
    set -g @plugin 'tmux-plugins/tmux-sensible'
    # set -g @plugin 'tmux-plugins/tpm'
    # prefix + I - Install plugins

    # set -g @plugin "arcticicestudio/nord-tmux"
    set -g @tmux_power_theme 'sky'
    set -g @plugin 'wfxr/tmux-power'
    # https://gist.github.com/desyncr/0682f9e394b74f13c3cf30ede030cfc4

    # set -g @plugin 'hoshiya4522/tokyo-night-tmux'
    # set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

    set -g @plugin 'tmux-plugins/tmux-copycat'
    # prefix + / - regex search

    set -g @plugin 'tmux-plugins/tmux-pain-control'
    # prefix + {p,n} prev, next window
    # prefix + {|,-,\,_} - Split panes (_,\ full width/height)
    # prefix + shift {h,j,k,l} - Resize pane
    # prefix + {<,>} - Swap window

    set -g @plugin 'tmux-plugins/tmux-yank'
    # copy-mode-vi y / mouse drag-select - copy to macOS clipboard
    # macOS-specific: use reattach-to-user-namespace for clipboard
    # if-shell "uname | grep -q Darwin" \
     #  "set -g default-command 'reattach-to-user-namespace -l zsh'"

    set -g @plugin 'tmux-plugins/tmux-resurrect'
    # prefix + Ctrl-s - save}
    # prefix + Ctrl-r - restore
    set -g @resurrect-capture-pane-contents 'on'

    set -g @plugin 'tmux-plugins/tmux-sessionist'
    # prefix + g - list sessions
    # prefix + C - create new session
    # prefix + X - kill current session
    # prefix + S - switches to last session

    set -g @plugin 'higoo-higoo/tmux-pane-ratio-saver'

    # Simple scratchpad
    set -g @tpad-scratchpad-bind    "o"
    set -g @tpad-scratchpad-opts    "status on"
    set -g @tpad-scratchpad-dir     "#{pane_current_path}"

    # Git management with lazygit (separate session per git repo)
    set -g @tpad-git-bind           "g"
    set -g @tpad-git-cmd            "git rev-parse --is-inside-work-tree && exec lazygit"
    set -g @tpad-git-height         "100%"
    set -g @tpad-git-width          "100%"
    set -g @tpad-git-per-dir        "true"
    set -g @tpad-git-shell          "true"
    set -g @tpad-git-style          "fg=red"

    # Copilot sessions (separate session per git repo)
    set -g @tpad-copilot-bind        "A"
    set -g @tpad-copilot-height      "90%"
    set -g @tpad-copilot-width       "30%"
    set -g @tpad-copilot-pos_x       "350%"
    set -g @tpad-copilot-pos_y       "80%"
    set -g @tpad-copilot-per-dir     "true"
    set -g @tpad-copilot-cmd         "copilot"
    set -g @tpad-copilot-opts        "status off"
    set -g @tpad-copilot-eject-split "right"
    set -g @tpad-copilot-eject-size  "40"

    # Notes with Neovim
    set -g @tpad-notes-bind         "N"
    set -g @tpad-notes-dir          "~/Notes/"
    set -g @tpad-notes-cmd          "nvim -c Texplore"
    set -g @tpad-notes-prefix       "None"
    set -g @tpad-notes-width        "80%"
    set -g @tpad-notes-height       "80%"

    # Right-click to open a scratchpad (table auto-detected as root for mouse events)
    set -g @tpad-scratch-bind       "MouseDown3Pane"

    # Keyboard shortcut without prefix key (explicit root table)
    set -g @tpad-quick-bind         "C-Space"
    set -g @tpad-quick-table        "root"

    set -g @plugin 'Subbeh/tmux-tpad'

    # run '~/.tmux/plugins/tpm/tpm'
    run 'tpack init'

    # overwrite tmux-power theme justify center
    set -gq status-justify "left"
# }}}}
